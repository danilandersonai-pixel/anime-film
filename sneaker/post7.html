<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Пост-продакшн v7</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Unbounded:wght@400..800&display=swap">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<style>
  html, body { margin: 0; background: transparent; }
  #ov { position: relative; width: 1920px; height: 1080px; }
  #ov svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
</style>
</head><body>
<!-- Пост-продакшн v7 «Кристаллы»: звук (audio7.js) и надписи (logo7.js) поверх кадров Cycles.
     Надписи — в координатах полного кадра 1920×1080 с кинорамкой (её дорисовывает ffmpeg). -->
<div id="ov"><svg id="card" viewBox="0 0 1920 1080"></svg></div>
<script type="module">
  import { createLogo } from './js/logo7.js';
  import { renderTrack7, LENGTH7 } from './js/audio7.js';
  import { toWav } from './js/audio5.js';
  await Promise.all(['400 44px Unbounded', '600 23px Unbounded'].map((f) => document.fonts.load(f, 'PULSE ONE ORBITA'))).catch(() => {});
  const FR = (await (await fetch('out/cycles7/frames7.json')).json()).frames;
  const logo = createLogo(document.getElementById('card'));
  window.__post = {
    length: LENGTH7, frames: FR.length,
    // кадр f: надпись (если уже появилась); true — в кадре что-то есть
    overlay: (f) => { const F = FR[f]; logo.update(F.t, { fade: 0 }); return F.logo > 0; },
    wav: async () => {
      const bytes = new Uint8Array(toWav(await renderTrack7(48000)));
      let s = '';
      for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      return btoa(s);
    },
    ready: true,
  };
</script>
</body></html>
